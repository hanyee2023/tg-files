<!DOCTYPE html>
<html lang="zh" data-theme="light" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TG Files</title>
<style>
  /* ===== 官方 Telegram 风格配色 ===== */
  :root{
    --tg-bg:#ffffff; --tg-panel:#ffffff; --tg-panel-2:#f4f4f5;
    --tg-hover:#f4f4f5; --tg-active:#3390ec1a; --tg-border:#ededed;
    --tg-text:#0f1419; --tg-sub:#707991; --tg-blue:#3390ec; --tg-blue-shade:#2b7cd3;
    --tg-bubble-in:#ffffff; --tg-bubble-out:#effdde; --tg-out-text:#0f1419;
    --tg-chat-bg:#ffffff; --tg-shadow:0 1px 2px rgba(16,35,47,.16);
    --tg-attach:#dfe7ec; --tg-danger:#e8513e; --tg-unread:#ffffff;
  }
  html[data-accent="blue"]{--tg-blue:#3390ec;--tg-blue-shade:#2b7cd3;}
  html[data-accent="green"]{--tg-blue:#2fae5f;--tg-blue-shade:#259b50;}
  html[data-accent="purple"]{--tg-blue:#8a5cf6;--tg-blue-shade:#7450d8;}
  html[data-theme="dark"]{
    --tg-bg:#17212b; --tg-panel:#17212b; --tg-panel-2:#131c26;
    --tg-hover:#232e3c; --tg-active:#3390ec33; --tg-border:#101a24;
    --tg-text:#ffffff; --tg-sub:#7d8b99; --tg-bubble-in:#182533;
    --tg-bubble-out:#2b5278; --tg-out-text:#ffffff; --tg-chat-bg:#0e1621;
    --tg-attach:#22303c; --tg-danger:#e0574d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--tg-bg);color:var(--tg-text);overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--tg-sub);border-radius:3px;opacity:.45;}
  a{color:var(--tg-blue);}

  #app{display:flex;height:100vh;width:100vw;}
  /* 侧边栏 */
  #sidebar{width:360px;min-width:360px;display:flex;flex-direction:column;background:var(--tg-panel);border-right:1px solid var(--tg-border);}
  #chat{flex:1;display:flex;flex-direction:column;background:var(--tg-chat-bg);min-width:0;position:relative;
    background-image:var(--tg-chat-pattern);background-repeat:repeat;}
  #details{width:320px;min-width:320px;display:none;flex-direction:column;background:var(--tg-panel);border-left:1px solid var(--tg-border);}
  @media(min-width:900px){ #details{display:flex;} }

  .icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tg-sub);transition:.15s;flex:0 0 auto;}
  .icon-btn:hover{background:var(--tg-hover);color:var(--tg-blue);}
  .icon-btn svg{width:22px;height:22px;}

  /* 头部 */
  #sidebarHeader{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--tg-border);}
  #searchWrap{flex:1;background:var(--tg-panel-2);border-radius:20px;padding:0 12px;display:flex;align-items:center;}
  #searchWrap input{flex:1;border:none;outline:none;background:none;color:var(--tg-text);height:38px;font-size:14px;}
  #searchWrap svg{width:18px;height:18px;color:var(--tg-sub);margin-right:6px;}

  #dialogs{flex:1;overflow-y:auto;}
  .dialog{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer;position:relative;border-radius:0;}
  .dialog:hover{background:var(--tg-hover);}
  .dialog.active{background:var(--tg-active);}
  .avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--tg-attach);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;overflow:hidden;}
  .avatar.sm{width:42px;height:42px;font-size:16px;}
  .avatar.xs{width:28px;height:28px;font-size:12px;flex:0 0 auto;}
  .dialog .meta{flex:1;min-width:0;}
  .dialog .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tg-text);}
  .dialog .last{color:var(--tg-sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .dialog .right{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;gap:6px;}
  .dialog .time{color:var(--tg-sub);font-size:11px;}
  .join-btn{font-size:12px;color:#fff;background:var(--tg-blue);border-radius:14px;padding:5px 12px;font-weight:600;}

  /* 聊天头部 */
  #chatHeader{display:none;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--tg-border);background:var(--tg-panel);z-index:5;}
  #chatTitleWrap{flex:1;min-width:0;}
  #chatTitle{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #chatStatus{font-size:12px;color:var(--tg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #messages{flex:1;overflow-y:auto;padding:14px 6%;display:flex;flex-direction:column;gap:2px;}
  .row{display:flex;width:100%;margin:2px 0;}
  .row.out{justify-content:flex-end;}
  .row.in{justify-content:flex-start;}
  .msg{max-width:78%;padding:6px 10px 8px 12px;border-radius:14px;position:relative;box-shadow:var(--tg-shadow);font-size:15px;line-height:1.35;word-wrap:break-word;background:var(--tg-bubble-in);color:var(--tg-text);}
  .row.in .msg{border-bottom-left-radius:4px;}
  .row.out .msg{border-bottom-right-radius:4px;}
  .sender-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  .msg .sender{font-size:13px;font-weight:600;color:var(--tg-blue);}
  .msg .text{white-space:pre-wrap;}
  .msg .mt{font-size:11px;opacity:.55;float:right;margin:4px 0 -2px 8px;}

  .msg-media{position:relative;margin-top:4px;border-radius:10px;overflow:hidden;background:var(--tg-attach);min-height:60px;display:flex;align-items:center;justify-content:center;width:min(340px,72vw);max-width:100%;}
  .msg-media img{display:block;width:100%;max-width:340px;border-radius:10px;}
  .msg-media video{width:100%;max-width:340px;border-radius:10px;background:#000;display:block;}
  .lazy-ph{width:100%;height:0;padding-bottom:75%;background:var(--tg-attach);border-radius:10px;background-size:cover;background-position:center;background-repeat:no-repeat;}
  .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);cursor:pointer;}
  .play-overlay svg{width:54px;height:54px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
  .media-size{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;z-index:2;}
  .file-card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--tg-active);border-radius:10px;margin-top:4px;}
  .file-card .fi{width:40px;height:40px;border-radius:8px;background:var(--tg-blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .file-card .fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-card .fs{font-size:11px;opacity:.7;margin-top:2px;}

  .msg-actions{position:absolute;top:-14px;display:flex;gap:2px;background:var(--tg-panel);border-radius:18px;padding:2px;box-shadow:var(--tg-shadow);opacity:0;transition:.15s;pointer-events:none;}
  .row.out .msg-actions{right:6px;}
  .row.in .msg-actions{left:6px;}
  .msg:hover .msg-actions{opacity:1;pointer-events:auto;}
  .act-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tg-sub);}
  .act-btn:hover{background:var(--tg-hover);color:var(--tg-blue);}
  .act-btn.del:hover{color:var(--tg-danger);}
  .act-btn svg{width:16px;height:16px;}

  /* 进度条（视频下载） */
  .progress{width:240px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);overflow:hidden;margin:8px 0;}
  .progress > i{display:block;height:100%;width:0;background:#fff;transition:width .2s;}
  .msg-media .progress{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.3);}
  .msg-media .progress > i{background:#fff;}
  .loading-spinner{width:26px;height:26px;border:3px solid var(--tg-blue);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 输入栏 */
  #composer{display:none;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--tg-border);background:var(--tg-panel);}
  #msgInput{flex:1;height:44px;border-radius:22px;border:none;outline:none;background:var(--tg-panel-2);color:var(--tg-text);padding:0 16px;font-size:15px;}
  #btnSend{background:var(--tg-blue);color:#fff;}
  #btnSend:hover{filter:brightness(1.08);color:#fff;}

  /* 右侧详情 */
  #detailsPlaceholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tg-sub);font-size:14px;padding:20px;text-align:center;}
  #detailsContent{flex:1;overflow-y:auto;display:none;flex-direction:column;align-items:center;padding:24px 16px;gap:10px;}
  #detailsContent.show{display:flex;}
  #detailsContent .big-avatar{width:96px;height:96px;font-size:38px;}
  #detailsContent .d-name{font-size:18px;font-weight:700;margin-top:8px;}
  #detailsContent .d-sub{font-size:13px;color:var(--tg-sub);}
  #detailsContent .d-about{font-size:13px;color:var(--tg-text);text-align:center;opacity:.85;margin-top:8px;line-height:1.5;}
  .d-stat{display:flex;width:100%;flex-direction:column;margin-top:12px;padding-top:12px;border-top:1px solid var(--tg-border);gap:2px;}
  .d-stat .stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;transition:.12s;}
  .d-stat .stat-row:hover{background:var(--tg-hover);}
  .d-stat .stat-row.clickable{cursor:pointer;}
  .d-stat .stat-label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tg-text);}
  .d-stat .stat-label svg{width:18px;height:18px;color:var(--tg-sub);}
  .d-stat .stat-val{font-size:15px;font-weight:700;color:var(--tg-text);}
  .d-stat .stat-row.clickable:hover .stat-val{color:var(--tg-blue);}
  .d-stat .stat-sub{font-size:11px;color:var(--tg-sub);text-align:right;}
  .d-stat-more{width:100%;text-align:center;padding:8px 0;}
  .d-stat-more button{font-size:13px;color:var(--tg-blue);font-weight:600;padding:6px 12px;border-radius:8px;}
  .d-stat-more button:hover{background:var(--tg-hover);}

  /* 设置面板（左侧） */
  .slide-panel{position:fixed;top:0;left:0;height:100vh;width:340px;max-width:90vw;background:var(--tg-panel);box-shadow:4px 0 20px rgba(0,0,0,.18);z-index:60;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;}
  .slide-panel.open{transform:translateX(0);}
  .panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--tg-border);font-size:17px;font-weight:600;}
  .panel-head .spacer{flex:1;}

  #accountHeader{display:flex;align-items:center;gap:12px;padding:18px 16px;background:var(--tg-blue);color:#fff;}
  #accountHeader .avatar{background:rgba(255,255,255,.2);}
  #accountHeader .a-name{font-size:17px;font-weight:700;}
  #accountHeader .a-sub{font-size:12px;opacity:.85;}

  .panel-body{flex:1;overflow-y:auto;padding:8px 0 16px;}
  .section-title{padding:20px 16px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--tg-sub);font-weight:600;}
  .opt{display:flex;align-items:center;gap:14px;padding:12px 16px;transition:background .12s;}
  .opt:hover{background:var(--tg-hover);}
  .opt .ico{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--tg-blue);}
  .opt .ico svg{width:22px;height:22px;}
  .opt .label{flex:1;min-width:0;font-size:15px;color:var(--tg-text);}
  .opt-line{display:flex;align-items:center;gap:14px;}
  .opt.col{flex-direction:column;align-items:stretch;gap:10px;}
  .opt.col .label{font-size:13px;color:var(--tg-sub);}
  .opt select{width:100%;background:var(--tg-bg);color:var(--tg-text);border:1px solid var(--tg-border);border-radius:8px;padding:9px 10px;font-size:14px;outline:none;}
  .opt select:focus{border-color:var(--tg-blue);}
  .seg{display:flex;gap:8px;}
  .seg button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:.12s;cursor:pointer;}
  .seg button:hover{transform:scale(1.08);}
  .seg button.sel{border-color:var(--tg-text);box-shadow:0 0 0 2px var(--tg-panel) inset;}
  .seg .s-blue{background:#3390ec;}.seg .s-green{background:#2fae5f;}.seg .s-purple{background:#8a5cf6;}
  .seg .t-light{background:#fff;border:1px solid var(--tg-border);}
  .seg .t-dark{background:#0e1621;}
  .bg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .bg-swatch{width:30px;height:30px;border-radius:50%;border:1px solid var(--tg-border);cursor:pointer;transition:transform .12s;}
  .bg-swatch:hover{transform:scale(1.12);}
  .bg-file{font-size:13px;color:var(--tg-blue);cursor:pointer;text-decoration:underline;}
  .primary-btn{width:100%;background:var(--tg-blue);color:#fff;border-radius:10px;padding:11px;font-weight:600;font-size:15px;transition:background .15s;}
  .primary-btn:hover{background:var(--tg-blue-shade);}
  .danger-btn{width:100%;color:var(--tg-danger);font-weight:600;font-size:15px;padding:11px;border-radius:10px;background:none;transition:background .12s;}
  .danger-btn:hover{background:var(--tg-hover);}
  /* 回到底部悬浮按钮（Telegram 风格：左下角圆形，带未读计数角标） */
  #btnScrollBottom{position:absolute;left:16px;bottom:78px;width:46px;height:46px;border-radius:50%;background:var(--tg-panel);color:var(--tg-blue);border:1px solid var(--tg-border);box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;transition:opacity .18s,transform .18s;}
  #btnScrollBottom.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  #btnScrollBottom svg{width:24px;height:24px;}
  #btnScrollBottom .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;background:var(--tg-blue);color:#fff;border-radius:10px;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center;line-height:1;border:2px solid var(--tg-panel);}
  #btnScrollBottom.has-new .badge{display:flex;}
  .bg-file{font-size:13px;color:var(--tg-blue);cursor:pointer;text-decoration:underline;}

  /* 网盘（全屏，应用主界面） */
  #netdisk{position:fixed;inset:0;width:100vw;height:100vh;max-width:100vw;z-index:200;background:var(--tg-bg);display:none;flex-direction:column;}
  #netdisk.open{display:flex;}
  /* 顶栏：菜单 + 标题 + 搜索 + 视图切换 */
  .nk-topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--tg-border);background:var(--tg-panel);flex:0 0 auto;}
  .nk-title{font-size:16px;font-weight:600;white-space:nowrap;flex:0 0 auto;}
  .nk-search{flex:1;display:flex;align-items:center;gap:6px;background:var(--tg-panel-2);border-radius:20px;padding:0 12px;min-width:0;}
  .nk-search svg{width:16px;height:16px;color:var(--tg-sub);flex:0 0 auto;}
  .nk-search input{flex:1;border:none;outline:none;background:none;color:var(--tg-text);height:38px;font-size:14px;min-width:0;}
  #netdiskTabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--tg-border);flex:0 0 auto;}
  #netdiskTabs button{flex:0 0 auto;padding:6px 14px;border-radius:16px;background:var(--tg-panel-2);color:var(--tg-sub);font-size:13px;font-weight:600;}
  #netdiskTabs button.sel{background:var(--tg-blue);color:#fff;}
  #netdiskGrid{flex:1;overflow-y:auto;align-content:start;}
  .fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--tg-blue);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:210;}
  .fab:hover{filter:brightness(1.08);}
  .fab svg{width:26px;height:26px;}

  /* 卡片右上角“更多”操作按钮（列表模式）+ 弹出菜单 */
  .nk-row{position:relative;}
  .nk-act{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;border:none;cursor:pointer;z-index:4;}
  .nk-act:hover{background:rgba(0,0,0,.65);}
  .nk-row .nk-act{top:50%;transform:translateY(-50%);}
  .card-menu{position:fixed;z-index:260;background:var(--tg-panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:6px;min-width:150px;display:none;}
  .card-menu.open{display:block;}
  .card-menu button{display:flex;align-items:center;width:100%;padding:10px 12px;border-radius:8px;font-size:14px;text-align:left;color:var(--tg-text);}
  .card-menu button:hover{background:var(--tg-hover);}
  .card-menu button.danger{color:var(--tg-danger);}

  /* 视频播放按钮：左下角圆形进度条 + 播放图标 + 视频大小（去掉居中大按钮） */
  .vbtn{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:6px;z-index:3;cursor:pointer;}
  .vbtn-bg{position:relative;width:30px;height:30px;display:inline-block;flex:0 0 auto;}
  .vbtn-bg svg{display:block;}
  .vbtn .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .vbtn .vsize{color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.7);}

  /* 自定义视频播放器（无默认 controls）：控件全透明、无黑影，仅左下角圆形进度 + 时间 + 静音 */
  .vp-wrap{position:relative;width:100%;max-width:340px;border-radius:10px;overflow:hidden;background:#000;display:block;}
  .vp-video{width:100%;display:block;background:#000;}
  .vp-controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;color:#fff;font-size:12px;z-index:4;}
  .vp-left{flex:0 0 auto;position:relative;width:36px;height:36px;}
  .vp-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:50%;color:#fff;border:none;cursor:pointer;padding:0;}
  .vp-play .vp-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .vp-ring{position:absolute;inset:-2px;pointer-events:none;}
  .vp-ring svg{width:100%;height:100%;}
  .vp-ring .cp{stroke:var(--tg-blue);}   /* 蓝色加载/缓冲进度 */
  .vp-time{font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.7);font-size:12px;}
  .vp-right{margin-left:auto;padding-right:14px;flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .vp-mute{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border-radius:50%;color:#fff;border:none;cursor:pointer;padding:0;}
  .vp-mute svg{width:16px;height:16px;fill:currentColor;}

  /* 消息卡片（参考官方样式）：底部浏览量+时间 */
  .msg-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:2px;font-size:11px;color:var(--tg-sub);}
  .vf-views{display:inline-flex;align-items:center;gap:3px;opacity:.9;}
  .vf-views svg{opacity:.85;}
  .vf-time{font-variant-numeric:tabular-nums;}

  /* 列表模式（网盘 / 媒体浏览器） */
  #netdiskGrid.list-mode,#mediaBrowserGrid.list-mode{display:flex;flex-direction:column;gap:8px;align-content:start;}
  .nk-row{display:flex;align-items:center;gap:12px;background:var(--tg-panel);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:var(--tg-shadow);}
  .nk-thumb.sm{width:48px;height:48px;padding-bottom:0;border-radius:8px;flex:0 0 auto;background:var(--tg-attach) center/cover no-repeat;position:relative;}
  .nk-meta{min-width:0;flex:1;}
  .nk-meta .nk-sub{font-size:12px;color:var(--tg-sub);margin-top:2px;}
  .text-btn{font-size:13px;color:var(--tg-blue);font-weight:600;padding:6px 10px;border-radius:8px;flex:0 0 auto;}
  .text-btn:hover{background:var(--tg-hover);}

  <script>
  // 全局错误捕获：任何加载/运行错误都会显示到底部红条，避免"一片空白"无从排查
  (function(){
    function showFatal(title, detail){
      try{
        var d=document.getElementById('__fatal');
        if(!d){
          d=document.createElement('div');d.id='__fatal';
          d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#e8513e;color:#fff;font-size:12px;line-height:1.5;padding:10px 12px;z-index:99999;white-space:pre-wrap;box-shadow:0 -2px 8px rgba(0,0,0,.2);max-height:40vh;overflow:auto;font-family:monospace;';
          d.onclick=function(ev){if(ev.target&&ev.target.tagName==='BUTTON')return;this.style.maxHeight=this.style.maxHeight==='none'?'40vh':'none';};
          document.body.appendChild(d);
        }
        var cfg=window.__CFG||{};
        var cfgLine='\n\n[配置] build='+cfg.build+' API='+(cfg.api?'已填':'缺失')+' HASH='+(cfg.hash?'已填':'缺失')+' 代理='+cfg.proxy;
        d.innerHTML='<b>⚠ '+escapeHtml(title)+'</b> （点空白展开/折叠；<button id="__copy">复制</button> 发开发者）\n'
          +(detail||'').split('\n').map(function(l){return escapeHtml(l);}).join('\n')
          +escapeHtml(cfgLine);
        var cp=document.getElementById('__copy');
        if(cp)cp.onclick=function(e){e.stopPropagation();try{navigator.clipboard.writeText(d.innerText);}catch(e){}};
      }catch(e){console.error('fatal',e);}
    }
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
    function describeError(err){
      if(err==null)return'null';
      if(typeof err==='string')return err;
      if(err instanceof Event){
        var t=err.target||err.srcElement;
        var info='事件: '+(err.type||'error');
        // ErrorEvent（JS 运行错误）但 error 为空时（跨域脚本被浏览器脱敏），至少把 message 带出来
        if(err.message&&err.message!=='error')info+='\n消息: '+err.message;
        if(t){
          var tn=t.tagName||(t.constructor&&t.constructor.name)||'?';
          info+='\n目标: '+tn;
          if(t.tagName==='SCRIPT'&&t.src)info+='\n脚本: '+t.src;
          else if(t.src)info+='\nsrc: '+t.src;
          if(t.href)info+='\nhref: '+t.href;
        }
        return info;
      }
      var parts=[];
      parts.push('类型: '+(err.name||err.constructor?.name||typeof err));
      if(err.message)parts.push('消息: '+err.message);
      if(err.filename)parts.push('文件: '+err.filename+':'+(err.lineno||'?')+':'+(err.colno||'?'));
      if(err.stack)parts.push('堆栈:\n'+err.stack);
      return parts.join('\n');
    }
    window.addEventListener('error',function(e){
      var t=e&&e.target;
      var src=(t&&t.src)||(t&&t.href)||(e&&e.filename)||'';
      // Cloudflare Pages 自动注入的 analytics 脚本加载失败，不是应用代码问题，忽略
      if(src.includes('cloudflareinsights.com')){console.warn('[ignore] cloudflareinsights error');return;}
      // 跨域脚本错误会被浏览器统一脱敏成 "Script error."（无文件名/无堆栈/无详情）。
      // 应用自身是同源脚本，出错会带完整类型/消息/堆栈；只有第三方注入脚本（如 Cloudflare
      // 统计脚本、手机浏览器自带的云加速/翻译注入）才会这样。与应用无关，忽略以免误导。
      var em=(e&&e.message)||'';
      if((em==='Script error.'||em==='Script error')&&!e.error&&!e.filename&&!e.lineno){
        console.warn('[ignore] 跨域脚本脱敏错误（Script error.，来自第三方注入脚本，与应用无关）');
        return;
      }
      // 媒体元素(video/audio/img)的加载/解码错误：流式播放中部分片段解码失败、换源瞬间等都属预期，
      // 会自动降级/恢复（如等待完整数据后重播），不是应用崩溃，不打红条
      if(t&&(t.tagName==='VIDEO'||t.tagName==='AUDIO'||t.tagName==='SOURCE'||t.tagName==='IMG')){
        console.warn('[ignore] 媒体加载/解码错误（流式播放中属预期，可自动恢复）：',(t.currentSrc||t.src||'').slice(0,90),t.error?('code='+t.error.code):'');
        return;
      }
      var err=e&&e.error?e.error:e;
      var msg=describeError(err);
      if(e&&e.filename&&!msg.includes('文件:'))msg='文件: '+e.filename+':'+(e.lineno||'?')+':'+(e.colno||'?')+'\n'+msg;
      showFatal('运行错误', msg || '未知错误');
    },true);
    window.addEventListener('unhandledrejection',function(e){
      var r=e&&e.reason;
      showFatal('未处理 Promise 错误', describeError(r));
    });
    // 自检：6 秒后主脚本仍未运行（window.__CFG 不存在）→ 说明 JS 加载失败。
    // 最常见原因：手机缓存了旧版 index.html，引用的旧 hash JS 已被新部署删除（404）。
    // 给出明确操作指引，替代令人困惑的"空白/报错"。
    setTimeout(function(){
      if(window.__CFG)return;
      showFatal('脚本加载失败（页面已过时）',
        '当前页面是旧缓存，它引用的 JS 文件在新部署中已不存在。\n'
        +'请按顺序尝试：\n'
        +'1. 下拉刷新本页 2~3 次\n'
        +'2. 浏览器菜单 → 清除本站缓存/Cookie 后重开\n'
        +'3. 或用无痕/隐私窗口打开本网址\n'
        +'4. 仍不行请换一个浏览器（推荐 Chrome / Edge）');
    },6000);
  })();
  </script>

      </div>
      <div class="opt">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-.7.6-1.3 1.3-1.3H17a4 4 0 0 0 4-4c0-4.4-4-6.7-9-6.7z"/><circle cx="7.5" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/></svg></span>
        <span class="label">主题色</span>
        <div class="seg" id="segAccent">
          <button class="s-blue sel" data-v="blue" title="蓝"></button>
          <button class="s-green" data-v="green" title="绿"></button>
          <button class="s-purple" data-v="purple" title="紫"></button>
        </div>
      </div>
      <div class="opt col">
        <div class="opt-line"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span><span class="label">聊天背景</span></div>
        <div class="bg-row">
          <span class="bg-swatch" data-bg="#ffffff" style="background:#ffffff;"></span>
          <span class="bg-swatch" data-bg="#f0f2f5" style="background:#f0f2f5;"></span>
          <span class="bg-swatch" data-bg="#e3f3fd" style="background:#e3f3fd;"></span>
          <span class="bg-swatch" data-bg="#effdde" style="background:#effdde;"></span>
          <span class="bg-swatch" data-bg="#f7e7ff" style="background:#f7e7ff;"></span>
          <span class="bg-file" id="btnBgImage">上传图片</span>
          <span class="bg-file" id="btnBgReset">恢复默认</span>
          <input id="bgFileInput" type="file" accept="image/*" hidden>
        </div>
      </div>
      <div class="section-title">网盘模式</div>
      <div class="opt col">
        <div class="opt-line"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="label">选择频道作为网盘</span></div>
        <select id="netdiskSelect"></select>
      </div>
      <div class="opt"><button id="btnEnterNetdisk" class="primary-btn">进入网盘</button></div>
      <div class="section-title">账号</div>
      <div class="opt"><button id="btnLogout" class="danger-btn">退出登录</button></div>
      <div id="buildTag"></div>
    </div>
  </div>

  <!-- 网盘（全屏，应用主界面） -->
  <div id="netdisk">
    <div class="nk-topbar">
      <button id="btnNetdiskMenu" class="icon-btn" title="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="nk-title">我的网盘</div>
      <div class="nk-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="netdiskSearchInput" placeholder="搜索文件" autocomplete="off">
      </div>
    </div>
    <div id="netdiskTabs">
      <button data-cat="all" class="sel">全部</button>
      <button data-cat="video">视频</button>
      <button data-cat="image">图片</button>
      <button data-cat="audio">音频</button>
      <button data-cat="document">文档</button>
      <button data-cat="file">文件</button>
    </div>
    <div id="netdiskGrid"></div>
    <button id="btnNetdiskUpload" class="fab" title="上传">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input id="netdiskFileInput" type="file" multiple hidden>
    <div id="nkCardMenu" class="card-menu"></div>
  </div>

  <!-- 全局连接错误浮层（网盘为主界面后，连接失败需全局可见） -->
  <div id="connOverlay" class="hidden"></div>

  <!-- 媒体查看器 -->
  <div id="viewer">
    <div id="viewerBar">
      <button class="viewer-btn" id="viewerClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div style="display:flex;gap:8px;">
        <button class="viewer-btn" id="viewerDownload" title="下载">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button class="viewer-btn" id="viewerShare" title="分享">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/></svg>
        </button>
      </div>
    </div>
    <img id="viewerMedia" alt="">
    <video id="viewerVideo" controls style="display:none;object-fit:contain;"></video>
    <div id="viewerNav">
      <button id="viewerPrev" title="上一张">‹</button>
      <button id="viewerNext" title="下一张">›</button>
    </div>
    <div id="viewerCap"></div>
  </div>

  <!-- 媒体浏览器（全部视频/图片） -->
  <div id="mediaBrowser">
    <div class="panel-head">
      <button id="mediaBrowserClose" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <span id="mediaBrowserTitle">媒体</span>
      <div class="spacer"></div>
    </div>
    <div id="mediaBrowserGrid"></div>
  </div>

  <div id="chatMenu" class="menu"></div>
  <div id="toast"></div>

  <!-- 登录页（未登录时显示） -->
  <div id="login" class="hidden">
    <div class="login-card">
      <div class="login-logo">📁</div>
      <h1>tg-files</h1>
      <p class="login-sub">登录 Telegram 账号以浏览文件</p>
      <div class="login-step" id="loginStepPhone">
        <label>手机号（含国家码，如 +8613800000000）</label>
        <input id="loginPhone" placeholder="+8613800000000" autocomplete="off" inputmode="tel">
        <button id="loginSend" class="login-btn">发送验证码</button>
      </div>
      <div class="login-step" id="loginStepCode" style="display:none">
        <label>验证码（Telegram 发来的短信）</label>
        <input id="loginCode" placeholder="12345" autocomplete="off" inputmode="numeric">
        <button id="loginVerify" class="login-btn">登录</button>
        <button id="loginBack" class="login-link" type="button">← 返回修改手机号</button>
      </div>
      <div id="loginErr" class="login-err"></div>
    </div>
  </div>

  <!-- 群内搜索 -->
  <div id="chatSearch" class="hidden">
    <div class="cs-bar">
      <button id="chatSearchClose" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <input id="chatSearchInput" placeholder="搜索此对话的聊天记录…" autocomplete="off">
    </div>
    <div id="chatSearchResults"></div>
    <div id="chatSearchLoading" class="empty-hint" style="display:none">搜索中…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
