<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Files</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0e1621;
      background-image: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #0e1621 50%),
                        radial-gradient(circle at 80% 70%, #1a2230 0%, #0e1621 50%);
      color: #e7edf3;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin-bottom: 16px; color: #6ab3f3; display: flex; align-items: center; gap: 8px; }
    h1::before { content: '📁'; font-size: 24px; }
    .card { background: #17212b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    input, button { font-size: 15px; padding: 10px 14px; border-radius: 8px; border: none; outline: none; }
    input { background: #0e1621; color: #fff; width: 100%; border: 1px solid #2b5278; transition: border-color 0.2s; }
    input:focus { border-color: #6ab3f3; box-shadow: 0 0 0 2px rgba(106,179,243,0.15); }
    button { background: #6ab3f3; color: #000; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.2s; }
    button:hover { background: #4a9fd8; }
    button:disabled { background: #2b5278; color: #666; cursor: not-allowed; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input { flex: 1; }
    .row button { width: auto; min-width: 100px; }
    .status { color: #999; font-size: 14px; margin-top: 8px; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .chat-item { display: flex; align-items: center; padding: 12px; border-radius: 10px; cursor: pointer; gap: 12px; transition: background 0.15s; }
    .chat-item:hover { background: #0e1621; }
    .chat-name { font-weight: 600; font-size: 15px; }
    .chat-sub { font-size: 13px; color: #888; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
    .back { color: #6ab3f3; cursor: pointer; margin-bottom: 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .back:hover { text-decoration: underline; }
    .hidden { display: none !important; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; color: #fff; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .file-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .file-card { background: #0e1621; border-radius: 10px; overflow: hidden; transition: transform 0.15s; }
    .file-card:hover { transform: translateY(-1px); }
    .file-thumb { width: 100%; height: 180px; background: #17212b; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
    .file-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .file-thumb .placeholder { font-size: 48px; opacity: 0.4; }
    .file-info { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .file-name { font-size: 14px; word-break: break-all; flex: 1; }
    .file-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .file-size { font-size: 12px; color: #888; }
    .file-btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; white-space: nowrap; cursor: pointer; border: none; font-weight: 600; }
    .btn-dl { background: #6ab3f3; color: #000; }
    .btn-dl:hover { background: #4a9fd8; }
    .btn-pre { background: #2b5278; color: #e7edf3; }
    .btn-pre:hover { background: #316294; }
    .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .preview-content { max-width: 90vw; max-height: 90vh; border-radius: 12px; overflow: hidden; }
    .preview-content img, .preview-content video, .preview-content audio { max-width: 90vw; max-height: 90vh; }
    .preview-close { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; z-index: 10000; background: rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .preview-close:hover { background: rgba(255,255,255,0.2); }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid #2b5278; border-top-color: #6ab3f3; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-type-icon { font-size: 28px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; color: #888; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab.active { color: #6ab3f3; border-bottom-color: #6ab3f3; }
    .tab:hover { color: #e7edf3; }
    .search-box { margin-bottom: 12px; }
    .search-box input { background: #0e1621; border: 1px solid #2b5278; border-radius: 8px; padding: 8px 14px; }
    .chat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .chat-header .avatar { width: 40px; height: 40px; font-size: 16px; }
    .load-more { text-align: center; padding: 16px; }
    .load-more button { width: auto; min-width: 140px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #666; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
    .video-badge { position: relative; }
    .video-badge::after { content: '▶'; position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Telegram Files</h1>

    <!-- 登录页 -->
    <div id="login-page" class="card">
      <div class="row">
        <input id="phone" placeholder="+8613800138000" />
        <button id="send-code-btn">发送验证码</button>
      </div>
      <div id="code-row" class="row hidden">
        <input id="code" placeholder="验证码" />
        <button id="sign-in-btn">登录</button>
      </div>
      <div id="password-row" class="row hidden">
        <input id="password" type="password" placeholder="两步验证密码" />
        <button id="password-btn">确认</button>
      </div>
      <div id="login-status" class="status"></div>
    </div>

    <!-- 聊天列表 -->
    <div id="chat-list-page" class="hidden">
      <div class="search-box">
        <input id="chat-search" placeholder="搜索频道..." />
      </div>
      <div class="card">
        <div id="chat-list"></div>
        <div id="chat-status" class="status"></div>
      </div>
    </div>

    <!-- 文件列表 -->
    <div id="file-list-page" class="hidden">
      <div class="back" id="back-btn">← 返回</div>
      <div class="card">
        <div class="chat-header">
          <div id="chat-avatar" class="avatar"></div>
          <h2 id="chat-title" style="font-size:18px;"></h2>
        </div>
        <div class="tabs">
          <div class="tab active" data-filter="all">全部</div>
          <div class="tab" data-filter="photo">图片</div>
          <div class="tab" data-filter="video">视频</div>
          <div class="tab" data-filter="audio">音频</div>
          <div class="tab" data-filter="doc">文档</div>
        </div>
        <div id="file-list" class="file-grid"></div>
        <div id="file-status" class="status"></div>
        <div id="load-more" class="load-more hidden">
          <button id="load-more-btn">加载更多</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 预览弹窗 -->
  <div id="preview-overlay" class="preview-overlay hidden">
    <div class="preview-close" id="preview-close">×</div>
    <div id="preview-content" class="preview-content">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
