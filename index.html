<!DOCTYPE html>
<html lang="zh" data-theme="light" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      /* 默认浅色（main.js 会按主题/主题色覆盖） */
      --accent: #3390ec;
      --accent-hover: #2b7ed4;
      --accent-soft: rgba(51,144,236,0.14);
      --bg-app: #ffffff;
      --bg-panel: #ffffff;
      --bg-hover: #f4f4f5;
      --bg-active: var(--accent-soft);
      --chat-bg: #ffffff;
      --bubble-in: #ffffff;
      --bubble-out: var(--accent-soft);
      --text-primary: #1c1c1e;
      --text-secondary: #707579;
      --text-meta: #a8b0b8;
      --divider: #e7e9ec;
      --input-bg: #f1f3f4;
      --scrollbar: rgba(0,0,0,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.10);
      --green: #2fae4f;
      --red: #e9573f;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 登录页 ===== */
    #login-view { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-app); }
    .login-card { background: var(--bg-panel); border-radius: 16px; padding: 32px; width: 360px; max-width: 90vw;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10); border: 1px solid var(--divider); }
    .login-card h1 { text-align: center; color: var(--accent); margin-bottom: 8px; font-size: 24px; }
    .login-card .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
    .login-card input { background: var(--input-bg); color: var(--text-primary); width: 100%;
      border: 1px solid transparent; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; font-size: 15px; outline: none; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button { background: var(--accent); color: #fff; width: 100%; border: none;
      border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .login-card button:hover { background: var(--accent-hover); }
    .login-card button:disabled { opacity: 0.5; cursor: default; }
    .login-status { text-align: center; margin-top: 12px; font-size: 14px; color: var(--text-secondary); }
    .login-status.error { color: var(--red); }
    .login-status.success { color: var(--green); }

    /* ===== 主布局 ===== */
    #app-view { display: none; height: 100vh; }
    #app-view.active { display: flex; }

    .sidebar { width: 360px; min-width: 360px; background: var(--bg-panel);
      border-right: 1px solid var(--divider); display: flex; flex-direction: column; height: 100vh; }
    .sidebar-header { padding: 8px 12px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--divider); height: 56px; flex-shrink: 0; }
    .search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
    .search-wrap .search-icon { position: absolute; left: 14px; width: 18px; height: 18px; fill: var(--text-secondary); pointer-events: none; }
    .search-wrap input { background: var(--input-bg); border: none; border-radius: 22px; padding: 8px 16px 8px 42px;
      width: 100%; color: var(--text-primary); font-size: 14px; outline: none; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .chat-item { display: flex; align-items: center; padding: 10px 12px; gap: 10px; cursor: pointer; transition: background 0.15s;
      border-bottom: 1px solid rgba(0,0,0,0.03); }
    .chat-item:hover { background: var(--bg-hover); }
    .chat-item.active { background: var(--bg-active); }
    .avatar { width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; color: #fff; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-info .name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
    .chat-info .preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .chat-info .preview .you { color: var(--accent); }

    .chat-window { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--chat-bg); }
    .chat-window.no-chat { align-items: center; justify-content: center; }
    .chat-window.no-chat .placeholder { text-align: center; color: var(--text-secondary); }
    .chat-window.no-chat .placeholder .icon { font-size: 56px; margin-bottom: 12px; }

    .chat-header { padding: 8px 16px; display: flex; align-items: center; gap: 12px;
      background: var(--bg-panel); border-bottom: 1px solid var(--divider); height: 56px; flex-shrink: 0; z-index: 2; }
    .chat-header .avatar { width: 42px; height: 42px; font-size: 16px; }
    .chat-header .info { flex: 1; min-width: 0; }
    .chat-header .info .name { font-size: 17px; font-weight: 500; }
    .chat-header .info .status { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
    .chat-header .actions { display: flex; gap: 4px; }

    .messages-wrap { flex: 1; overflow: hidden; position: relative; background: var(--chat-bg); }
    .messages-bg { position: absolute; inset: 0; background: var(--chat-bg); background-size: cover; background-position: center; }
    .messages { position: relative; height: 100%; overflow-y: auto; padding: 10px 16px; max-width: 820px; margin: 0 auto; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .date-sep { text-align: center; margin: 16px 0 8px; }
    .date-sep span { background: var(--bg-hover); padding: 4px 12px; border-radius: 12px; font-size: 13px; color: var(--text-secondary); }

    .msg { display: flex; margin-bottom: 4px; max-width: 72%; }
    .msg.out { margin-left: auto; flex-direction: row-reverse; }
    .msg.in { margin-right: auto; }
    .msg-bubble { border-radius: 12px; padding: 6px 10px; position: relative; word-break: break-word; font-size: 15px; line-height: 1.4;
      background: var(--bubble-in); color: var(--text-primary); box-shadow: var(--shadow); }
    .msg.out .msg-bubble { background: var(--bubble-out); }
    .msg-bubble .sender { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
    .msg-bubble .text { white-space: pre-wrap; }
    .msg-bubble .meta { font-size: 11px; color: var(--text-meta); text-align: right; margin-top: 2px; }
    .msg.out .msg-bubble .meta { color: var(--text-secondary); }

    .msg-media { border-radius: 10px; overflow: hidden; margin-bottom: 4px; max-width: 360px; background: var(--bg-hover); }
    .msg-media img { width: 100%; display: block; cursor: pointer; }
    .msg-media video { width: 100%; display: block; max-height: 400px; background: #000; }
    .msg-media audio { width: 100%; }
    .msg-media .file-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-hover); border-radius: 10px; min-width: 220px; }
    .msg-media .file-icon { font-size: 32px; }
    .msg-media .file-info { flex: 1; min-width: 0; }
    .msg-media .file-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-media .file-size { font-size: 12px; color: var(--text-secondary); }
    .msg-media .file-dl-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

    .input-bar { padding: 8px 16px; display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-panel); border-top: 1px solid var(--divider); flex-shrink: 0; }
    .input-bar textarea { flex: 1; background: var(--input-bg); border: none; border-radius: 18px; padding: 10px 16px;
      color: var(--text-primary); font-size: 15px; resize: none; max-height: 120px; min-height: 44px; line-height: 1.4; font-family: inherit; outline: none; }
    .input-bar .send-btn { background: var(--accent); color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; }
    .input-bar .send-btn:hover { background: var(--accent-hover); }
    .input-bar .send-btn:disabled { opacity: 0.3; cursor: default; }
    .input-bar .attach-btn { color: var(--text-secondary); background: none; border: none; cursor: pointer;
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .input-bar .attach-btn:hover { background: var(--bg-hover); color: var(--accent); }
    .input-bar .attach-btn svg, .input-bar .send-btn svg { width: 22px; height: 22px; fill: currentColor; }
    #file-input { display: none; }

    /* 统一图标按钮（菜单/返回/搜索/操作等） */
    .icon-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; }
    .icon-btn:hover { background: var(--bg-hover); color: var(--accent); }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    #menu-btn, #back-btn { color: var(--text-secondary); background: none; border: none; cursor: pointer;
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    #menu-btn:hover, #back-btn:hover { background: var(--bg-hover); color: var(--accent); }
    #menu-btn svg, #back-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* 设置面板 */
    .settings-panel { position: fixed; top: 0; left: 0; width: 360px; height: 100vh; background: var(--bg-panel);
      z-index: 100; transform: translateX(-100%); transition: transform 0.3s; overflow-y: auto; border-right: 1px solid var(--divider); }
    .settings-panel.open { transform: translateX(0); }
    .settings-panel .header { padding: 16px; border-bottom: 1px solid var(--divider); display: flex; align-items: center; gap: 12px; }
    .settings-panel .header .close { cursor: pointer; font-size: 20px; color: var(--text-secondary); background: none; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .settings-panel .header .close:hover { background: var(--bg-hover); }
    .settings-panel .header .close svg { width: 22px; height: 22px; fill: currentColor; }
    .settings-section { padding: 16px; border-bottom: 1px solid var(--divider); }
    .settings-section h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 600; }
    .settings-section .bg-option { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; }
    .settings-section .bg-option:hover { background: var(--bg-hover); }
    .settings-section .bg-preview { width: 48px; height: 48px; border-radius: 8px; background: var(--bg-hover); flex-shrink: 0; }
    .settings-section .bg-preview img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
    .settings-section input[type="file"] { width: 100%; margin-top: 8px; }
    .settings-section input[type="range"] { width: 100%; accent-color: var(--accent); }
    .settings-section label { font-size: 13px; color: var(--text-secondary); }

    .theme-row { display: flex; gap: 10px; align-items: center; }
    .theme-opt { flex: 1; padding: 10px; border: 1px solid var(--divider); border-radius: 10px; background: var(--bg-app);
      color: var(--text-primary); cursor: pointer; font-size: 14px; font-weight: 500; }
    .theme-opt.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .accent-opt { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .accent-opt.active { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--bg-panel) inset; }

    .btn-danger { background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; width: 100%; font-size: 14px; font-weight: 500; }

    /* 图片预览弹窗 */
    .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .preview-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
    .preview-close { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; z-index: 10000; background: rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; }

    .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--divider); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 0; }
      .sidebar.hidden-mobile { display: none; }
      .chat-window { display: none; }
      .chat-window.active-mobile { display: flex; }
      .chat-header .back-btn { display: block; }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view">
    <div class="login-card">
      <h1>Telegram</h1>
      <div class="subtitle">请登录你的账号</div>
      <input id="phone" placeholder="+8613800138000" />
      <div id="code-row" class="hidden">
        <input id="code" placeholder="验证码" style="margin-top: 10px;" />
      </div>
      <div id="password-row" class="hidden">
        <input id="password" type="password" placeholder="两步验证密码" style="margin-top: 10px;" />
      </div>
      <button id="main-btn">发送验证码</button>
      <div id="login-status" class="login-status"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-view">
    <!-- 左侧 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="menu-btn" id="menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="search-input" placeholder="搜索" />
        </div>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- 右侧聊天 -->
    <div class="chat-window no-chat" id="chat-window">
      <div class="placeholder">
        <div class="icon">💬</div>
        <div>选择一个对话开始聊天</div>
      </div>
      <div class="chat-header hidden" id="chat-header">
        <button class="back-btn" id="back-btn" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
        </button>
        <div class="avatar" id="chat-avatar"></div>
        <div class="info">
          <div class="name" id="chat-name"></div>
          <div class="status" id="chat-status"></div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="search-in-chat" aria-label="搜索">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          </button>
        </div>
      </div>
      <div class="messages-wrap hidden" id="messages-wrap">
        <div class="messages-bg" id="messages-bg"></div>
        <div class="messages" id="messages"></div>
      </div>
      <div class="input-bar hidden" id="input-bar">
        <button class="attach-btn" id="attach-btn" aria-label="附件">
          <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 1 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 1 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 1 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg>
        </button>
        <input type="file" id="file-input" multiple />
        <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settings-panel">
    <div class="header">
      <button class="close" id="settings-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
      </button>
      <span>设置</span>
    </div>
    <div class="settings-section">
      <h3>聊天背景</h3>
      <div class="bg-option" data-bg="default">
        <div class="bg-preview" style="background:#ffffff;"></div>
        <span>默认浅色</span>
      </div>
      <div class="bg-option" data-bg="telegram">
        <div class="bg-preview" style="background:linear-gradient(135deg,#cfe6ff,#eef4fb);"></div>
        <span>Telegram 风格</span>
      </div>
      <div class="bg-option" data-bg="custom">
        <div class="bg-preview" id="custom-bg-preview" style="background:var(--bg-hover);display:flex;align-items:center;justify-content:center;font-size:20px;">＋</div>
        <span>自定义图片</span>
      </div>
      <input type="file" id="bg-file-input" accept="image/*" />
      <div style="margin-top: 8px;">
        <label>背景透明度</label>
        <input type="range" id="bg-opacity" min="0" max="40" value="0" />
      </div>
    </div>
    <div class="settings-section">
      <h3>账号</h3>
      <button id="logout-btn" class="btn-danger">退出登录</button>
    </div>
  </div>

  <!-- 图片预览 -->
  <div class="preview-overlay hidden" id="preview-overlay">
    <button class="preview-close" id="preview-close">×</button>
    <img id="preview-img" src="" alt="" />
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
